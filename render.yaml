services:
  - type: web
    name: pygold
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: SECRET_KEY
        generateValue: true
      - key: PYGOLD_DATA_DIR
        value: /var/data
    disk:
      name: pygold-data
      mountPath: /var/data
      sizeGB: 1
